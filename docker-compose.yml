version: '3.8'

services:
  neo4j:
    image: neo4j:4.4.12
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-adminer}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_memory_heap_initial__size: 512M
      NEO4J_dbms_memory_heap_max__size: 2G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p $${NEO4J_AUTH} 'RETURN 1' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  ad-miner:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./cache_neo4j:/app/cache_neo4j
      - ./render:/app/render
    environment:
      - BOLT_URL=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-adminer}
    depends_on:
      neo4j:
        condition: service_healthy
    restart: on-failure
    command: ["python3", "-m", "ad_miner", "-cf", "report", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:-adminer}", "-b", "bolt://neo4j:7687"]

volumes:
  neo4j_data:
  neo4j_logs: